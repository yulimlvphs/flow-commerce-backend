spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flow_commerce?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

logging:
  level:
    org.hibernate.SQL: debug

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

jwt:
  issuer: flow-commerce
  audience: flow-commerce-api
  secret: ${JWT_SECRET}
  access-token-ttl: 15m